[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-task-manager"
version = "0.1.0"
description = "Ein nativer Linux-Task-Manager im Stil von Windows 10"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PySide6>=6.10,<7", "psutil>=7,<8"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
task-manager = "task_manager.app:main"

[tool.setuptools.packages.find]
include = ["task_manager*"]

[tool.setuptools.package-data]
task_manager = ["assets/*.svg"]
